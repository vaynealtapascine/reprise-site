<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#d9ee9f">
    <title>Reprise — Coming soon</title>
    <meta name="description" content="Words, with room to move. Reprise is a WYSIWYG editor for writing and shaping documents. Coming soon.">
    <link rel="canonical" href="https://reprise.ink/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Reprise — Coming soon">
    <meta property="og:description" content="Words, with room to move. A WYSIWYG editor for writing and shaping documents. Coming soon.">
    <meta property="og:url" content="https://reprise.ink/">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="preload" href="./fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./styles.css">
    <script src="./main.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <a class="wordmark" href="./" aria-label="Reprise home">reprise<span class="wordmark-period">.</span></a>
        <p class="status"><span class="status-dot" aria-hidden="true"></span>Coming soon</p>
      </header>

      <main class="hero">
        <div class="hero-copy">
          <h1>Words, with<br>room to <em>move.</em></h1>
          <p class="description">A WYSIWYG editor for writing<br class="desktop-break"> and shaping documents.</p>
          <p class="invitation">Reprise is taking shape. Come back soon.</p>
        </div>

        <div class="type-study">
          <div class="composition" aria-hidden="true">
            <svg class="flow-line" viewBox="0 0 440 440" fill="none">
              <path d="M63 67C164-4 372 17 387 133C403 254 37 210 42 304C47 413 285 441 369 359"/>
              <path d="m354 357 16 2-4 16"/>
            </svg>
            <span class="study-word word-one">word</span>
            <span class="study-word word-two">after</span>
            <span class="study-word word-three">word.</span>
            <span class="composition-star">*</span>
          </div>
          <button class="rearrange" type="button" hidden>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8h14m-4-4 4 4-4 4M20 16H6m4-4-4 4 4 4"/></svg>
            Move the words
          </button>
          <span class="sr-only" role="status" id="composition-status"></span>
        </div>
      </main>

      <footer class="footer">
        <p>A little space for your next big idea.</p>
        <span>reprise.ink</span>
      </footer>
    </div>
  </body>
</html>
